name: Test Contracts

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/test-contracts.yml'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: |
          cd contracts
          rm -rf lib/openzeppelin-contracts/fv lib/openzeppelin-contracts/test lib/openzeppelin-contracts/scripts
          forge build --sizes
