[workspace]
resolver = "2"
members = [
    "src/crypto",
    "src/core",
    "src/pow",
    "src/network",
    "src/node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
thiserror = "1"
hex = "0.4"
rand = "0.8"
ed25519-dalek = "2"
blake3 = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
